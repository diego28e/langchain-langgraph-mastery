# Pre-commit hooks (Lesson 12.09). Install once: python -m pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files. Hook versions verified 2026-10-16.
repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout                 # notebooks are committed without outputs (CONVENTIONS)
        args: [--keep-id]              # keep cell ids: the generators keep them stable (no noisy diffs)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check                 # the same minimal gate as CI, on the service code
        args: [--select, "E9,F"]
        files: ^(src/mastery/service/|apps/m12_service/|apps/m12_agent_server/)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048]
