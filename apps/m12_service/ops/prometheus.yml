# Prometheus for the support desk (Lesson 12.07): scrape the API every 15 s and evaluate alerts.yml.
# Started by: docker compose -f apps/m12_service/compose.yaml --profile obs up -d   (UI: http://localhost:9090)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agent
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # With MASTERY_SERVICE_METRICS_TOKEN set on the API, add:
    # authorization:
    #   credentials: <the same token>
