<!doctype html>
<!-- The Orbita Cloud support desk UI (Lesson 12.09). Plain HTML + JS, served by the service at /ui/. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbita Cloud support</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Orbita Cloud support</h1>
    <span id="version" class="muted"></span>
  </header>
  <section id="login">
    <label>API key <input id="key" type="password" autocomplete="off" placeholder="your API key"></label>
    <button id="signin">Sign in</button>
    <p class="muted">The key stays in this browser tab only (sessionStorage) and is sent as a Bearer token.</p>
  </section>
  <main id="chat" hidden>
    <div id="log" aria-live="polite"></div>
    <div id="approval" hidden>
      <p id="approval-text"></p>
      <button id="approve">Approve</button> <button id="reject">Reject</button>
    </div>
    <form id="ask">
      <input id="message" maxlength="4000" placeholder="Ask about invoices, refunds, API keys…" autocomplete="off">
      <button id="send" type="submit">Send</button>
      <button id="cancel" type="button" disabled>Stop</button>
      <button id="new" type="button">New chat</button>
    </form>
    <p id="status" class="muted"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
