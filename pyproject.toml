# =============================================================================
# pyproject.toml: packaging for the course's reusable `mastery` package.
#
# Introduced in Module 00 (Lesson 00.02 guide + Lesson 00.04). Install it into
# the course environment ONCE, in "editable" mode, from the repo root:
#
#     python -m pip install -e ".[dev]"
#
# "Editable" means Python imports the code straight from src/mastery/, so every
# change you make there is visible after a kernel restart (or %autoreload,
# taught in Module 03). Dependencies listed here are only the ones `mastery`
# imports itself; lesson packages (langchain, langchain-groq, ...) are
# installed per lesson with %pip (see requirements.txt).
# Versions verified on PyPI on 2026-10-11.
# =============================================================================

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mastery"
version = "0.1.0"
description = "Reusable helpers grown module by module in the Modern LangChain & LangGraph Mastery course."
readme = "src/README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.4,<2",  # mastery.config: load .env files
    "httpx>=0.28.1,<1",         # mastery.groq_catalog: call the Groq Models API
]

[project.optional-dependencies]
# LangChain stack used by mastery.models / pricing / display (Module 01+).
# Imported lazily, so `import mastery` works without it (Module 00).
llm = [
    "langchain>=1.4.4,<2",
    "langchain-core>=1.6.9,<2",
    "langchain-groq>=1.1.3,<2",
]
# LangSmith Studio / local Agent Server (Module 02, Lesson 02.07): `langgraph dev`.
# VERIFIED 2026-10-12: langgraph-cli 0.4.33 is current on PyPI; the [inmem]
# extra pulls langgraph-api (needs Python >= 3.11).
# langgraph-api lower bound (D-023): chromadb ([rag]) pulls opentelemetry-exporter-otlp-proto-grpc with no
# upper bound; without this floor pip picks otlp 1.45 and silently backtracks langgraph-api to 0.10.x (whose
# opentelemetry pins it accepts) instead of keeping the current Agent Server. Measured 2026-10-12.
studio = [
    "langgraph-cli[inmem]>=0.4.33,<1",
    "langgraph-api>=0.16.0,<1",
]
# Memory (Module 03): SqliteSaver / SqliteStore for mastery.memory.
# VERIFIED 2026-10-12: langgraph-checkpoint-sqlite 3.1.1 is current on PyPI;
# it pulls aiosqlite and sqlite-vec (vector search inside SQLite).
# Module 08 uses its AsyncSqliteSaver (aiosqlite) for async graphs; no new package.
memory = [
    "langgraph-checkpoint-sqlite>=3.1.1,<4",
]
# Local embeddings (Module 03 stretch; Module 06 lessons) and the local cross-encoder re-ranker (06.08).
# NOT in [dev]: ~150 MB of wheels (onnxruntime) + model downloads (~67 MB embeddings, ~80 MB re-ranker).
# Module 06 installs it with: python -m pip install -e ".[dev,embeddings]". Without it, lessons fall back
# to the offline HashingEmbeddings and every test still passes.
# VERIFIED 2026-10-12: fastembed 0.9.0 is current on PyPI (ONNX, no PyTorch).
embeddings = [
    "fastembed>=0.9.0,<1",
]
# MCP and web search (Module 05): mastery.mcp_servers (FastMCP) and mastery.web_search.
# VERIFIED 2026-10-12 on PyPI: langchain 1.4.4 ([mcp] pulls fastmcp>=4.0.11,<5; 4.1.0 current,
# with mcp 2.3.0), langchain-tavily 0.2.18. Tavily needs TAVILY_API_KEY only when you call it.
mcp = [
    "langchain[mcp]>=1.4.4,<2",
    "langchain-tavily>=0.2.18,<1",
]
# RAG (Module 06): mastery.rag (loaders, splitters, Chroma persistence).
# VERIFIED 2026-10-12 on PyPI: langchain-text-splitters 1.1.3, langchain-chroma 1.1.0
# (pulls chromadb 1.5.x), pypdf 6.20.1, beautifulsoup4 4.15.0. Loaders use pypdf/bs4 directly,
# as the LangChain knowledge-base tutorial now does (no langchain-community).
# Local embeddings and re-ranking (fastembed, ONNX) stay in [embeddings].
rag = [
    "langchain-text-splitters>=1.1.3,<2",
    "langchain-chroma>=1.1.0,<2",
    "pypdf>=6.20.1,<7",
    "beautifulsoup4>=4.15.0,<5",
]
# Notebook tooling (Module 09): Jupytext pairs each .ipynb with a plain .py (percent format) for review/diffs.
# VERIFIED 2026-10-12: jupytext 1.19.6 is current on PyPI (pure Python, pulls only small deps).
notebooks = [
    "jupytext>=1.19.6,<2",
]
# Testing, evaluation & observability (Module 10): judges (openevals), trajectory evals (agentevals)
# and OpenTelemetry tracing. VERIFIED 2026-10-15: openevals 0.2.0, agentevals 0.0.9, opentelemetry 1.45.1 on PyPI.
evals = [
    "langsmith[otel]>=0.14.7,<1",
    "openevals>=0.2.0,<1",
    "agentevals>=0.0.9,<1",
    "opentelemetry-sdk>=1.42.1,<2",
    "opentelemetry-exporter-otlp>=1.42.1,<2",
]
# Developer tools: `python -m pip install -e ".[dev]"`
# Includes the llm extra so every unit test runs (offline, with fake models).
dev = [
    "pytest>=9.1.1,<10",
    "nbformat>=5.11.1,<6",
    # VERIFIED 2026-10-12: nbconvert 7.17.2 is current on PyPI. Gives
    # `jupyter nbconvert --clear-output --inplace` inside the course env.
    "nbconvert>=7.17.2,<8",
    # VERIFIED 2026-10-14: markdown-it-py 4.2.0 is current on PyPI (jupytext already pulls it).
    # Parses notebook Markdown cells (Markdown rendering checks).
    "markdown-it-py>=4.2.0,<5",
    "mastery[llm]",
    # Module 02: `langgraph dev` for Studio (Lesson 02.07), so one install covers it.
    "mastery[studio]",
    # Module 03: SQLite checkpointer/store, so every memory test runs offline.
    "mastery[memory]",
    # Module 05: FastMCP servers, MCPAdapter and Tavily, so every MCP test runs offline.
    "mastery[mcp]",
    # Module 06: splitters, PDF/HTML loaders and Chroma, so every RAG test runs offline.
    "mastery[rag]",
    # Module 09: Jupytext (pairing notebooks with .py scripts, Lesson 09.01's Jupyter skill).
    "mastery[notebooks]",
    # Module 10: openevals, agentevals and OpenTelemetry, so every eval and tracing test runs offline.
    "mastery[evals]",
]

# CI and notebook QA: what `python -m pytest -m notebooks` needs to run every notebook headless
# (the %pip cells install these in a learner's kernel; CI installs them up front).
# VERIFIED 2026-10-14: floors are the versions the course's notebooks were last run with.
ci = [
    "mastery[dev]",
    "nbclient>=0.11.0,<1",
    "ipykernel>=7.3.0,<8",
    "pandas>=3.0.6,<4",
    "matplotlib>=3.11.2,<4",
    "grandalf>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pytest imports `mastery` from THIS clone's src/, even before `python -m pip install -e ".[dev]"`
# or when the env was installed from another clone. Notebook setup cells do the same.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: calls real APIs and needs keys in .env (run with: pytest -m integration)",
    "notebooks: runs every course notebook headless with no keys, slow (run with: pytest -m notebooks)",
]
# Unit tests only by default: no network, no API keys, fast.
addopts = "-m 'not integration and not notebooks'"
