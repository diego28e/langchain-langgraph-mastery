# Eval gate (Module 10, Lesson 10.08): the support desk's pre-release suite on every change that can
# alter its behaviour. Offline and deterministic, so it needs no secrets and runs on forks too.
# Exit code 1 (a failed gate) blocks the pull request when this check is marked "required".
name: Eval gate

on:
  pull_request:
    paths:
      - "src/mastery/agents/**"
      - "src/mastery/evals/**"
      - "data/samples/support-desk/**"
      - ".github/workflows/eval-gate.yml"
  workflow_dispatch:
    inputs:
      candidate:
        description: "Desk version to gate (no-auth-context shows a blocked release)"
        type: choice
        options: [baseline, no-auth-context]
        default: baseline

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate (support desk)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the course stack
        run: python -m pip install -e ".[dev]"
      - name: Unit tests for the eval tooling
        run: python -m pytest -q tests/unit/test_evals_m10.py tests/unit/test_evals_m10_release.py
      - name: Run the release suite and apply the gates
        # Writes the Markdown report to the job summary (GITHUB_STEP_SUMMARY) and to gate-report.md.
        run: python -m mastery.evals.release_gate --candidate "${{ inputs.candidate || 'baseline' }}" --report gate-report.md
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-report
          path: gate-report.md
          if-no-files-found: ignore
